# =====================================================================
# Redis Cluster Dashboard 설정
#  - 우선순위: 환경변수(PXA_*) > 이 파일 > 코드 기본값   (pxa-common 규칙)
#  - 다른 경로의 설정 파일을 쓰려면 PXA_CONFIG=/path/to/config.yaml
#  - 비밀번호는 파일에 두지 말고 PXA_MONITOR__PASSWORD 환경변수로 주입 권장
# =====================================================================

app:
  name: redis-dashboard
  debug: false

logging:
  dir: ./logs
  level: INFO
  filename: redis-dashboard.log
  backup_count: 7

messages:
  files:
    - config/messages.yaml

server:
  host: 0.0.0.0
  port: 8080

monitor:
  cluster_name: redis-cluster

  # 모니터링 대상 노드(마스터/레플리카 모두) 를 전부 등록한다. 클러스터는 1개만.
  #
  # [VM 1대] 한 VM 에 포트만 다른 인스턴스 여러 개
  #   - { host: 10.10.0.11, port: 7001 }
  #   - { host: 10.10.0.11, port: 7002 }
  #   ...
  # [VM 3대] VM 마다 master 1 + replica 1
  #   - { host: 10.10.0.11, port: 7001 }
  #   - { host: 10.10.0.11, port: 7002 }
  #   - { host: 10.10.0.12, port: 7001 }
  #   - { host: 10.10.0.12, port: 7002 }
  #   - { host: 10.10.0.13, port: 7001 }
  #   - { host: 10.10.0.13, port: 7002 }
  nodes:
    - { host: 192.168.56.1, port: 6379 }
    - { host: 192.168.56.1, port: 6380 }
    - { host: 192.168.56.1, port: 6381 }

  username:            # ACL 사용자 (없으면 비워둠)
  password:            # PXA_MONITOR__PASSWORD 로 주입 권장

  # 명령 실행 방식
  #   redis-py  : Python 클라이언트로 동일한 명령(PING, INFO, CLUSTER INFO ...) 전송 (기본, 권장)
  #   redis-cli : 대시보드 서버에 설치된 redis-cli 를 subprocess 로 실행
  executor: redis-py
  redis_cli_path: redis-cli

  collect_interval_seconds: 10   # 서버 측 수집 주기
  command_timeout_seconds: 2.0   # 노드별 명령 타임아웃
  window_minutes: 10             # 추이 보관 기간 (최대 10)
  default_refresh: 10s           # 화면 기본 갱신 주기 (?refresh= 로 변경)

  # maxmemory 가 0(무제한)인 노드의 Memory % 기준
  #   system : used_memory / total_system_memory  (화면에 '시스템 기준' 표시)
  #   none   : 계산하지 않음 (그래프에 표시 안 함)
  memory_basis_when_unlimited: system

  memory_warn_pct: 80
  memory_crit_pct: 90
